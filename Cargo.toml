[package]
name = "breadbug-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Intake, triage and clustering server for breadbug reports"

[lib]
name = "breadbug_server"
path = "src/lib.rs"

[[bin]]
name = "breadbug-server"
path = "src/main.rs"

[dependencies]
url = "2"
addr2line = "0.25"
anyhow = "1"
axum = "0.8"
bread-scrub = { git = "https://git.breadway.dev/Breadway/bread", branch = "feature/breadbug-scrubber" }
hex = "0.4"
hmac = "0.12"
object = { version = "0.37", default-features = false, features = ["read", "std"] }
rand = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
tracing = "0.1"
ureq = { version = "2", default-features = false, features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
ctor = "0.8"
http-body = "1"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
